services:
  cairn:
    build: .
    image: cairn:latest
    container_name: cairn
    restart: unless-stopped
    ports:
      - "${CAIRN_HOST_PORT:-3847}:3847"
    volumes:
      - cairn_data:/app/data
      - cairn_backups:/app/backups
      - ./config:/app/config
      # Optional: mount SSH keys for rsync backup target (read-only)
      # - ~/.ssh:/root/.ssh:ro
    env_file:
      - .env.local

volumes:
  cairn_data:
  cairn_backups:
