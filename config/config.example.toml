# Cairn configuration
# Copy this file to config/config.toml and adjust.

[digest]
# Cron expression for the daily morning email.
schedule = "0 6 * * *"

# Send the email even when there are no imminent items.
send_when_empty = true

# Subject line for the daily digest.
subject_prefix = "Cairn —"

[backup]
# Cron expression for sqlite backup.
schedule = "0 2 * * *"

# How many backup copies to keep on the destination.
retention_count = 14

[ui]
# Product name shown in the UI and email footer.
name = "Cairn"
tagline = "Stones on the trail."

